server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        # Serve index.html for all non-file requests (SPA routing)
        try_files $uri /index.html;
    }

    location /static/ {
        # Serve static assets normally
        root /usr/share/nginx/html;
    }

    error_page 404 /index.html;
}
