version: "3.9"

services:
  inventory_service:
    build: ./inventory_service
    container_name: inventory_service
    ports:
      - "8000:8000"
    networks:
      - app-network

  ai_service:
    build: ./ai_service
    container_name: ai_service
    ports:
      - "8001:8001"
    networks:
      - app-network
    depends_on:
      - inventory_service

  dashboard:
    build: ./dashboard
    container_name: dashboard
    ports:
      - "3000:80"
    networks:
      - app-network
    depends_on:
      - inventory_service
      - ai_service

networks:
  app-network:
    driver: bridge
